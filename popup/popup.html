<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>Clarity</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a10 10 0 0 1 0 20"/>
      </svg>
      <span class="logo-text">Clarity</span>
    </div>
  </header>

  <div class="divider"></div>

  <!-- Primary Actions -->
  <section class="actions">
    <button class="btn-primary" id="btn-guide">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M3 9h6M3 15h6"/>
      </svg>
      <div class="btn-content">
        <span class="btn-label">Create Documentation Guide</span>
        <span class="btn-sub">Capture step-by-step workflows</span>
      </div>
    </button>

    <button class="btn-primary" id="btn-record">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
      </svg>
      <div class="btn-content">
        <span class="btn-label">Record Cinematic Video</span>
        <span class="btn-sub">Screen recording with effects</span>
      </div>
    </button>
  </section>

  <div class="divider"></div>

  <!-- Recent Sessions -->
  <section class="recent">
    <h3 class="section-title">Recent</h3>
    <div id="sessions-list" class="sessions-list">
      <p class="empty-state">No recent sessions</p>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
