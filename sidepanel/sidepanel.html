<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarity</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- ── Home View ──────────────────────────────────────────────────────── -->
  <div id="view-home" class="view active">
    <header class="sp-header">
      <div class="sp-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 1 0 20"/>
        </svg>
        <span class="sp-logo-text">Clarity</span>
      </div>
      <button class="sp-icon-btn" id="btn-settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </button>
    </header>

    <div class="sp-hero">
      <h2 class="sp-hero-title">What would you like to do?</h2>
    </div>

    <div class="sp-actions">
      <button class="sp-action-btn sp-action-primary" id="btn-start-capture">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 3v18M3 9h6M3 15h6"/>
        </svg>
        <span>Start Capture</span>
      </button>

      <button class="sp-action-btn" id="btn-start-recording">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
        </svg>
        <span>Record Video</span>
      </button>
    </div>

    <!-- Tabs: Recent / Discover -->
    <div class="sp-tabs">
      <button class="sp-tab active" data-tab="recent">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Recent
      </button>
      <button class="sp-tab" data-tab="discover">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Discover
      </button>
    </div>

    <div class="sp-sessions-list" id="sessions-list">
      <div class="sp-empty-state">
        <div class="sp-empty-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
        </div>
        <p class="sp-empty-title">No captures yet</p>
        <p class="sp-empty-sub">Click "Start Capture" to create your first guide</p>
      </div>
    </div>
  </div>

  <!-- ── Capture View (Live Steps) ──────────────────────────────────────── -->
  <div id="view-capture" class="view">
    <header class="sp-header sp-header-capture">
      <div class="sp-capture-info">
        <div class="sp-rec-indicator">
          <div class="sp-rec-dot"></div>
          <span class="sp-rec-label">CAPTURING</span>
        </div>
        <span class="sp-capture-timer" id="capture-timer">00:00</span>
      </div>
      <div class="sp-capture-actions">
        <button class="sp-icon-btn" id="btn-pause-capture" title="Pause">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="sp-icon-btn sp-icon-btn-stop" id="btn-stop-capture" title="Finish">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
        </button>
      </div>
    </header>

    <div class="sp-capture-title-wrap">
      <input class="sp-capture-title" id="capture-title" value="Untitled Guide" placeholder="Guide title..." />
    </div>

    <!-- Color Picker -->
    <div class="sp-color-picker" id="color-picker">
      <span class="sp-color-label">Highlight Color</span>
      <div class="sp-color-grid" id="color-grid"></div>
      <div class="sp-color-custom-row">
        <label class="sp-color-custom-label" for="custom-color">Custom</label>
        <input type="color" id="custom-color" class="sp-color-input" value="#FF2D55" />
      </div>
    </div>

    <!-- Live Step List -->
    <div class="sp-steps-live" id="steps-live">
      <div class="sp-steps-empty">
        <p>Click on elements to capture steps...</p>
      </div>
    </div>

    <!-- Screenshot Preview of Last Step -->
    <div class="sp-step-preview" id="step-preview">
    </div>

    <!-- Bottom Controls -->
    <div class="sp-capture-bottom">
      <div class="sp-bottom-row-top">
        <button class="sp-bottom-btn" id="btn-undo-step" title="Undo Last Step">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h13a4 4 0 0 1 0 8H7"/><path d="M3 10l4-4M3 10l4 4"/></svg>
          <span>Undo</span>
        </button>
        <button class="sp-bottom-btn" id="btn-add-text-step" title="Add Text Step">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          <span>Add Note</span>
        </button>
      </div>
      <button class="sp-finish-btn" id="btn-finish-capture">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        <span>Finish Guide</span>
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
